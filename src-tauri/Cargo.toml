[package]
name = "nivalis-save-editor"
version = "1.7.0"
description = "Savegame editor for Nivalis Nights"
authors = ["RenokK"]
license = "CC-BY-NC-4.0"
edition = "2021"

[lib]
name = "nivalis_save_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"

# Small, fast release binary for distribution.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
